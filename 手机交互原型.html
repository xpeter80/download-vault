<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下载保险箱 · 交互原型</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9eeeb;color:#18332b;font:15px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}main{max-width:480px;margin:auto;background:#f6f8f5;min-height:100vh;padding:28px 22px 110px}header{display:flex;justify-content:space-between;align-items:center}small,.muted{color:#60756c;font-size:12px}h1{font-size:28px;letter-spacing:-1px;margin:12px 0}h2{font-size:20px;margin:6px 0 18px}p{line-height:1.7}.pill{border:1px solid #bdcdc3;border-radius:20px;padding:7px 10px;font-size:12px}.hero{background:#183e32;color:white;border-radius:24px;padding:24px;margin:24px 0}.hero small{color:#b4d5c6}.hero strong{display:block;font-size:34px;margin:12px 0}.card{background:white;border:1px solid #dfe6df;border-radius:18px;padding:18px;margin:12px 0}button,input,textarea,select{font:inherit}button{min-height:44px;border:0;border-radius:12px;padding:10px 14px;background:#eaf0eb;color:#244d3c;cursor:pointer}button.primary{background:#27664d;color:white;width:100%;margin-top:15px}button.danger{color:#a43a30;background:#fff0ec}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #ba8c36;outline-offset:2px}textarea,input:not([type=checkbox]),select{width:100%;padding:12px;border:1px solid #ccd8ce;border-radius:12px;background:white;margin:8px 0 12px;color:#18332b}textarea{resize:vertical;min-height:90px}input[type=checkbox]{width:20px;height:20px;accent-color:#27664d;vertical-align:middle}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.file{display:flex;gap:12px;align-items:center;padding:17px 0;border-bottom:1px solid #e8ede8}.file .info{flex:1;min-width:0}.file b{font-size:14px;display:block;overflow-wrap:anywhere}.file small{display:block;margin-top:7px}.icon{background:#eaf1ec;padding:12px;border-radius:12px}.star{font-size:23px;background:transparent;color:#8c691f;padding:6px;min-width:44px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);display:flex;background:#ffffffed;padding:12px 20px max(15px,env(safe-area-inset-bottom));gap:8px;border-top:1px solid #dae4dc}nav button{flex:1;background:transparent}nav button.active{background:#e3eee5;font-weight:700}.note{background:#fff8e6;border-radius:12px;padding:12px;font-size:12px;line-height:1.6;color:#755825}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.actions button{flex:1}.date{font-weight:600;font-size:12px;margin-top:20px;color:#66796e}dialog{border:0;border-radius:22px;max-width:430px;width:calc(100% - 30px);padding:24px;color:#18332b}dialog::backdrop{background:#18332b66}#toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#173d32;color:white;padding:14px 20px;border-radius:14px;z-index:5;max-width:90%;display:none}label{line-height:1.8}.empty{text-align:center;padding:35px 10px;color:#63776b}
</style><main><header><b>◈ NOVA / 下载保险箱</b><span class="pill">交互演示</span></header><div id="app"></div></main><nav><button data-page="download">↓ 下载</button><button data-page="files">▤ 文件</button><button data-page="settings">⚙ 设置</button></nav><dialog id="modal"></dialog><div id="toast" role="status"></div><script>
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let page='download',filter='all',search='',start='2026-09-30';let cfg={vault:'.vault',visible:'visible',temp:'temporary'};let files=[{id:1,name:'山野旅行纪录片.mp4',date:'2026-10-02',zone:'hidden',star:true,size:2.4},{id:2,name:'设计参考素材.zip',date:'2026-10-02',zone:'hidden',star:false,size:.8},{id:3,name:'周末电影.mp4',date:'2026-10-01',zone:'temporary',star:false,size:3.1},{id:4,name:'摄影课程.pdf',date:'2026-09-30',zone:'hidden',star:false,size:.1},{id:5,name:'家庭相册.zip',date:'2026-09-29',zone:'visible',star:true,size:1.2}];let queue=[];let timer;const zone={hidden:'保险箱',temporary:'临时可见',visible:'普通可见'};
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('#toast').style.display='none',3500)}
function shown(){return files.filter(f=>(filter==='all'||(filter==='star'?f.star:f.zone===filter))&&f.name.includes(search))}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='download'){$('#app').innerHTML=`<div class="hero"><small>你的文件，由你决定何时可见</small><strong>下载，收好。</strong><span>手机粘贴链接 · NAS 持续下载</span></div><div class="card"><h2>添加下载</h2><label for="url">下载链接</label><textarea id="url" placeholder="在这里长按，粘贴直链或磁力链接"></textarea><label><input type="checkbox" id="hidden" checked> 对 NAS 访问者隐藏</label><p class="muted">按下载日期自动归档。隐藏文件仍可在本应用中管理。</p><button class="primary" id="submit">＋ 开始下载</button></div><div class="row"><h2>下载队列</h2><small>模拟状态</small></div>${queue.map(q=>`<div class="card"><b>${esc(q.name)}</b><p class="muted">等待下载 · ${q.hidden?'保险箱':'普通可见'}</p></div>`).join('')||'<div class="card muted">当前没有下载任务，粘贴链接即可开始。</div>'}<p class="note">原型使用虚构数据，不连接 NAS，不会实际下载或修改文件。刷新页面恢复演示数据。</p>`;$('#submit').onclick=()=>{let u=$('#url').value.trim();if(!/^(https?:\/\/\S+|magnet:\?\S+)$/i.test(u))return toast('请输入 HTTP(S) 直链或磁力链接');queue.unshift({name:u,hidden:$('#hidden').checked});render();toast('演示任务已加入队列')};}
if(page==='files'){$('#app').innerHTML=`<h1>我的文件</h1><p class="muted">收藏留住喜欢的，其他随时整理。</p><div class="row"><label style="flex:1">查看区域<select id="filter">${[['all','全部文件'],['hidden','保险箱'],['temporary','临时可见'],['visible','普通可见'],['star','已收藏']].map(([v,t])=>`<option value="${v}" ${filter===v?'selected':''}>${t}</option>`).join('')}</select></label></div><label for="search">搜索文件</label><input id="search" placeholder="输入文件名" value="${esc(search)}"><div class="actions"><button id="expose">临时公开</button><button id="hide">全部移回</button><button id="clean" class="danger">清理非收藏</button></div><div class="note">全部移回仅作用于临时可见区；普通可见文件保持原位。</div><div id="list"></div>`;list();$('#filter').onchange=e=>{filter=e.target.value;list()};$('#search').oninput=e=>{search=e.target.value;list()};$('#expose').onclick=expose;$('#hide').onclick=()=>confirmOp('移回保险箱',files.filter(f=>f.zone==='temporary'),'将临时可见文件移回原日期位置，保留收藏。',f=>f.zone='hidden');$('#clean').onclick=()=>confirmOp('删除非收藏文件',shown().filter(f=>!f.star),'仅清理当前区域与搜索结果中的非收藏文件。正式应用将永久删除，无法恢复。',f=>files=files.filter(x=>x.id!==f.id));}
if(page==='settings'){$('#app').innerHTML=`<h1>设置</h1><p class="muted">目录位置清晰，整理就更安心。</p><div class="card"><h2>保存位置</h2><label>隐藏目录<input id="vault" value="${esc(cfg.vault)}"></label><label>普通可见目录<input id="visible" value="${esc(cfg.visible)}"></label><label>临时可见目录<input id="temp" value="${esc(cfg.temp)}"></label><button class="primary" id="save">保存演示设置</button></div><div class="card"><div class="row"><b>归档时区</b><span>Asia/Shanghai</span></div><p class="muted">日期以任务创建时间为准。</p></div><p class="note">点目录用于浏览隐藏，不是加密。正式配置需检查同盘、权限和共享规则。此处仅演示设置，不迁移文件。</p>`;$('#save').onclick=()=>{let v=$('#vault').value.trim(),n=$('#visible').value.trim(),t=$('#temp').value.trim();if(!/^\.[^./][^/]*$/.test(v)||![n,t].every(x=>/^[^./][^/]*$/.test(x))||new Set([v,n,t]).size!==3)return toast('请输入三个不同的目录名，隐藏目录以点开头');cfg={vault:v,visible:n,temp:t};toast('演示设置已保存（刷新后重置）')}}}
function list(){let a=shown(),last='';$('#list').innerHTML=a.map(f=>{let d=f.date!==last?`<div class="date">${f.date}</div>`:'';last=f.date;return d+`<div class="file"><span class="icon">▧</span><div class="info"><b>${esc(f.name)}</b><small>${f.size.toFixed(1)} GB · ${zone[f.zone]}</small></div><button class="star" data-star="${f.id}" aria-label="${f.star?'取消收藏':'收藏'} ${esc(f.name)}" aria-pressed="${f.star}">${f.star?'★':'☆'}</button></div>`}).join('')||'<div class="empty">没有匹配文件<br><small>试试切换区域或清除搜索</small></div>';document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{let f=files.find(x=>x.id===+b.dataset.star);f.star=!f.star;list()})}
function confirmOp(title,a,desc,fn){$('#modal').innerHTML=`<h2>${title}</h2><p>${desc}</p><div class="card"><b>${a.length} 个文件 · ${a.reduce((s,f)=>s+f.size,0).toFixed(1)} GB</b>${a.map(f=>`<p class="muted">${esc(f.name)}</p>`).join('')}</div><div class="row"><button id="cancel">取消</button><button id="confirm" ${a.length?'':'disabled'}>确认${title}</button></div>`;$('#modal').showModal();$('#cancel').onclick=()=>$('#modal').close();$('#confirm').onclick=()=>{a.forEach(fn);$('#modal').close();render();toast(`演示完成：${a.length} 个文件`)}}
function expose(){$('#modal').innerHTML=`<h2>临时公开</h2><label>选择此日期及之后<input id="since" type="date" value="${start}"></label><p class="muted">勾选日期文件夹，公开其中所有已完成文件，包括收藏。</p><div id="dates"></div><div class="actions"><button id="cancel">取消</button><button id="preview">预览文件</button></div>`;$('#modal').showModal();function dates(){start=$('#since').value;let ds=[...new Set(files.filter(f=>f.zone==='hidden'&&f.date>=start).map(f=>f.date))];$('#dates').innerHTML=ds.map(d=>`<p><label><input type="checkbox" data-date="${d}" checked> ${d}</label></p>`).join('')||'<p>此日期之后没有隐藏文件</p>'}dates();$('#since').onchange=dates;$('#cancel').onclick=()=>$('#modal').close();$('#preview').onclick=()=>{let ds=[...document.querySelectorAll('[data-date]:checked')].map(e=>e.dataset.date);let a=files.filter(f=>f.zone==='hidden'&&ds.includes(f.date));$('#modal').close();confirmOp('移到临时可见区',a,'保留日期结构和收藏状态，之后可一键移回。',f=>f.zone='temporary')}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();window.scrollTo(0,0)});render();
</script></html>
